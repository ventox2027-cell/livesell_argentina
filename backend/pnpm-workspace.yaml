# pnpm bloquea por defecto los scripts de instalación de las dependencias, que
# es lo correcto: un `postinstall` es ejecución de código arbitrario de un
# tercero en la máquina de quien instala.
#
# Estas cinco lo necesitan de verdad —Prisma baja sus engines, swc y esbuild
# sus binarios nativos— y se habilitan de forma explícita. Sin esta lista, pnpm
# abre un prompt interactivo que en CI deja la build colgada hasta el timeout.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  # Acelerador nativo opcional de msgpackr, que usa BullMQ para serializar los
  # jobs. Se deja SIN compilar: funciona igual en JavaScript puro, y los jobs
  # que mandamos son tres campos. Compilar código nativo en cada máquina y en
  # CI a cambio de microsegundos que no vamos a notar no vale el riesgo.
  msgpackr-extract: false
  prisma: true

# Una sola versión de Fastify en todo el árbol.
#
# NestJS resolvía 5.11.0 por su cuenta mientras los plugins se compilaron
# contra 5.11.3. Los tipos de `FastifyInstance` difieren entre ambas, así que
# registrar un plugin no compilaba — con un error de tipos de veinte líneas
# que no dice "tenés dos versiones".
overrides:
  fastify: 5.11.3
