name: vendox
description: "VendoX — venta en vivo. Feed vertical, transmisiones y compra integrada."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Video en tiempo real ───────────────────────────────────────────────────
  # SDK OFICIAL de LiveKit. Fue la razón determinante para elegir LiveKit sobre
  # AWS IVS: el reproductor de IVS para Flutter es comunitario.
  livekit_client: ^2.4.0

  # ── Estado ─────────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Red y sistema ──────────────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.1.0 # WiFi ⇄ 4G: el evento que más rompe un live
  device_info_plus: ^11.2.0 # sin modelo de dispositivo, los números no se interpretan
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.10 # la pantalla no puede apagarse a mitad de una medición
  shared_preferences: ^2.3.3
  intl: ^0.19.0

  # ── Pagos (Sprint 0B) ──────────────────────────────────────────────────────
  # El formulario de tarjeta corre en un WebView contra el CardForm de Mercado
  # Pago, en modo iframe. Es lo que impide que el número de tarjeta pase por
  # nuestro código y mantiene el alcance PCI en SAQ-A en vez de SAQ-D.
  # No es una preferencia de implementación: es el motivo por el que podemos
  # cobrar sin una auditoría anual encima.
  webview_flutter: ^4.10.0

  # Para abrir la autorización de Mercado Pago en el navegador DEL SISTEMA.
  #
  # No en un WebView: Mercado Pago pide la contraseña ahí adentro, y en una
  # vista que nosotros controlamos el vendedor no tiene forma de saber que no
  # la estamos leyendo. El navegador del sistema muestra el dominio real.
  url_launcher: ^6.3.1

  # Para compartir por la hoja nativa del sistema.
  #
  # No un botón propio que copia al portapapeles: la hoja del sistema muestra
  # las apps que la persona realmente usa, y compartir por WhatsApp es un toque
  # en vez de tres.
  share_plus: ^10.1.4
  flutter_secure_storage: ^10.3.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  google_sign_in: ^7.2.0

  # Avisos push. El backend ya los manda con firebase-admin desde hace rato;
  # esto es el lado que faltaba. Ver core/push/.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

  # Enlaces de vendox.com.ar que abren la app. Entrega el enlace inicial —app
  # cerrada— y los siguientes —app abierta—. Ver core/enlaces/.
  app_links: ^6.4.1
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# Ícono de la app.
#
# El logo viene con el fondo negro incorporado, que es lo correcto para el
# ícono clásico. Para el adaptativo de Android hace falta separarlo: el sistema
# recorta la capa de adelante contra una máscara —círculo, cuadrado redondeado,
# gota, según el lanzador— y si el fondo viniera pegado a la imagen se vería el
# borde del cuadrado recortado dentro del círculo.
#
# Por eso el fondo va como color plano y el logo se achica un 18 %: sin ese
# margen, las puntas de la V y la X quedan fuera de la máscara circular.
flutter_launcher_icons:
  image_path: "assets/logo/vendox.png"
  android: "ic_launcher"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/vendox.png"
  adaptive_icon_foreground_inset: 18
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
