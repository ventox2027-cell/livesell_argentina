name: livesell_spike
description: "Sprint 0 · Spike de LiveKit — medición de latencia real desde Argentina"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Video en tiempo real ───────────────────────────────────────────────────
  # SDK OFICIAL de LiveKit. Fue la razón determinante para elegir LiveKit sobre
  # AWS IVS: el reproductor de IVS para Flutter es comunitario.
  livekit_client: ^2.4.0

  # ── Estado ─────────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Red y sistema ──────────────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.1.0 # WiFi ⇄ 4G: el evento que más rompe un live
  device_info_plus: ^11.2.0 # sin modelo de dispositivo, los números no se interpretan
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.10 # la pantalla no puede apagarse a mitad de una medición
  shared_preferences: ^2.3.3
  intl: ^0.19.0

  # ── Pagos (Sprint 0B) ──────────────────────────────────────────────────────
  # El formulario de tarjeta corre en un WebView contra el CardForm de Mercado
  # Pago, en modo iframe. Es lo que impide que el número de tarjeta pase por
  # nuestro código y mantiene el alcance PCI en SAQ-A en vez de SAQ-D.
  # No es una preferencia de implementación: es el motivo por el que podemos
  # cobrar sin una auditoría anual encima.
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^10.3.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
