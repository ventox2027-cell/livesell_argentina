include: package:flutter_lints/flutter.yaml

# El ancho real del proyecto.
#
# `dart format` por omisión corta en 80, y todo el código de esta app está
# escrito a ~100. Sin esta línea, correr el formateador sobre un archivo lo
# deja distinto del resto y llena los diffs de reindentaciones que no aportan
# nada. Se descubrió formateando un widget nuevo y viendo el destrozo.
formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # En una app que maneja dinero, un await olvidado es un bug silencioso.
    unawaited_futures: error
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print          # usar el logger, no print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
    - sort_child_properties_last
    - avoid_unnecessary_containers
